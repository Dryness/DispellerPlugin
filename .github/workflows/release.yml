name: Release

# Tag a commit v1.4 (matching <Version> in Dispeller.csproj) and push the tag:
#   git tag -a v1.4 -m "..." && git push origin v1.4
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Must match InternalName in the manifest; DalamudPackager names the
  # assembly, the manifest and the output folder after it.
  INTERNAL_NAME: DispellerContinued

  # The API level this plugin targets. Stated here rather than read from the
  # source manifest because DalamudPackager injects DalamudApiLevel at build
  # time - it is in the built manifest, which is too late to check what to
  # build against. Both guards below compare against this.
  DALAMUD_API_LEVEL: '15'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Dalamud is not on the runner. Dalamud.NET.Sdk only auto-resolves an
      # XIVLauncher install, so point DALAMUD_HOME at the published distrib.
      #
      # The stable channel, NOT the api15/ path. That path is frozen on a
      # pre-release 14.0.5.2 build whose FFXIVClientStructs is a different
      # vintage from the one players run, so code that builds against a current
      # install failed here on a changed method signature. Stable is 15.0.3.1,
      # which is what XIVLauncher installs.
      - name: Fetch Dalamud
        run: |
          curl -fsSL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q dalamud.zip -d "$RUNNER_TEMP/dalamud"

          # Assert the fetched build matches the API level the manifest targets.
          # Without this the mismatch above surfaced as an unrelated-looking
          # compile error rather than as "you built against the wrong Dalamud",
          # and a future channel move would do the same again.
          got=$(jq -r '.libraries | keys | map(select(startswith("Dalamud/"))) | .[0]' \
            "$RUNNER_TEMP/dalamud/Dalamud.deps.json" | cut -d/ -f2)
          echo "Fetched Dalamud $got; this plugin targets API level $DALAMUD_API_LEVEL."
          if [ "${got%%.*}" != "$DALAMUD_API_LEVEL" ]; then
            echo "That is the wrong API level. Update DALAMUD_API_LEVEL, or the distrib channel above."
            exit 1
          fi

      - name: Build
        run: DALAMUD_HOME="$RUNNER_TEMP/dalamud" dotnet build -c Release

      # net10.0-windows cross-compiles on Linux, so the artifact built here is
      # the same one a Windows build produces.

      - name: Check the tag matches the built version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(jq -r .AssemblyVersion "bin/Release/$INTERNAL_NAME.json")
          # AssemblyVersion is always 4-part (1.4.0.0, 1.5.1.0) while the tag carries only
          # the components written in the csproj (v1.4, v1.5.1). Pad both to four and
          # compare. Stripping a literal ".0.0" suffix only worked for two-part versions:
          # 1.5.1.0 does not end in ".0.0", so a three-part release could never be tagged.
          pad() { IFS=. read -r a b c d <<< "$1"; echo "${a:-0}.${b:-0}.${c:-0}.${d:-0}"; }
          if [ "$(pad "$tag")" != "$(pad "$built")" ]; then
            echo "Tag $GITHUB_REF_NAME does not match built version $built."
            echo "Bump <Version> in Dispeller.csproj, or retag."
            exit 1
          fi

          # Closes the loop on the fetch check: that one verified what we built
          # against, this one verifies what the packager then claimed to target.
          # A disagreement means the SDK moved without the workflow noticing.
          level=$(jq -r .DalamudApiLevel "bin/Release/$INTERNAL_NAME.json")
          if [ "$level" != "$DALAMUD_API_LEVEL" ]; then
            echo "Built manifest declares API level $level, expected $DALAMUD_API_LEVEL."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "bin/Release/$INTERNAL_NAME/latest.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # repo.json is what Dalamud reads when the URL is added as a custom
      # plugin repository. The download links are version-independent
      # (/releases/latest/download/), so only AssemblyVersion changes here -
      # but Dalamud detects updates by comparing that field, so it has to be
      # republished on the default branch for anyone to be offered the update.
      - name: Update repo.json on ${{ github.event.repository.default_branch }}
        run: |
          branch="${{ github.event.repository.default_branch }}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.zip"
          icon="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${branch}/images/icon.png"

          # LastUpdate is what the installer shows as "last updated". The docs'
          # example gives it as a unix timestamp in a string. Taken from the
          # tagged commit so it is deterministic rather than run-dependent.
          jq --arg url "$url" --arg ts "$(git log -1 --format=%ct)" --arg icon "$icon" \
            '[. + {DownloadLinkInstall: $url, DownloadLinkUpdate: $url, DownloadLinkTesting: $url, LastUpdate: $ts, IconUrl: $icon}]' \
            "bin/Release/$INTERNAL_NAME.json" > "$RUNNER_TEMP/repo.json"

          git fetch origin "$branch"
          git checkout -B publish-repo-json "origin/$branch"
          cp "$RUNNER_TEMP/repo.json" repo.json

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- repo.json; then
            echo "repo.json already current, nothing to publish."
            exit 0
          fi
          git commit -m "repo.json: $GITHUB_REF_NAME" -- repo.json
          git push origin "publish-repo-json:$branch"
